<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        .dashboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        .dashboard-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .dashboard-buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

            .dashboard-buttons button {
                padding: 15px 30px;
                font-size: 18px;
                border: none;
                border-radius: 8px;
                background-color: #007bff;
                color: white;
                cursor: pointer;
                transition: background-color 0.3s;
            }

                .dashboard-buttons button:hover {
                    background-color: #0056b3;
                }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-title">Welcome to Dashboard</div>
        <div class="dashboard-buttons">
            <button onclick="window.location.href='../pages/users.html'">Manage Users</button>
            <button onclick="window.location.href='../pages/movies.html'">Manage Movies</button>
            <button onclick="window.location.href='../pages/books.html'">Manage Books</button>
        </div>
    </div>
</body>
</html>
